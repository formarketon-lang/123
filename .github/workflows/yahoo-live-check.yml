name: Yahoo Live Data Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yahoo-live-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Yahoo live check
        run: |
          python -m scripts.run_yahoo_live_check

      - name: Upload Yahoo raw data
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-live-data
          path: data/raw/yahoo/
          if-no-files-found: error
          
