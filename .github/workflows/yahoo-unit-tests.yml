
name: Yahoo Adapter Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "tests/**"
      - ".github/workflows/yahoo-unit-tests.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "data/**"
      - "tests/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  yahoo-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Schema and Yahoo Adapter Tests
        run: |
          python -m pytest -q \
            tests/test_data_schema.py \
            tests/test_yahoo_adapter.py
