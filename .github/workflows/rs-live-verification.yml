
name: TradeLab Pro RS Live Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rs-live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live multi-benchmark RS verification
        run: |
          python scripts/run_rs_live_verification.py

      - name: Upload live verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-live-rs-verification
          path: reports/phase3_live_verification/
          if-no-files-found: warn
          retention-days: 30
          
