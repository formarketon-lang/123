
name: CH25 Step 39 NSE Identity Continuity

on:
  workflow_dispatch:
    inputs:
      previous_date:
        description: "Previous NSE archive date (YYYY-MM-DD)"
        required: true
        type: string
      current_date:
        description: "Current NSE archive date (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  identity-continuity:
    runs-on: ubuntu-latest

    env:
      PREVIOUS_DATE: ${{ inputs.previous_date }}
      CURRENT_DATE: ${{ inputs.current_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate and normalize dates
        run: |
          python - <<'PY'
          import os
          from datetime import date

          previous = os.environ["PREVIOUS_DATE"].strip()
          current = os.environ["CURRENT_DATE"].strip()

          previous_date = date.fromisoformat(previous)
          current_date = date.fromisoformat(current)

          if previous_date >= current_date:
              raise SystemExit(
                  "Previous date must be earlier than current date."
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PREVIOUS_DATE={previous_date.isoformat()}\n")
              f.write(f"CURRENT_DATE={current_date.isoformat()}\n")

          print("Date validation: PASS")
          print(f"Previous date: {previous_date}")
          print(f"Current date: {current_date}")
          PY

      - name: Run Step 37 regression tests
        run: |
          python -m pytest -q tests/test_ch25_step37_nse_snapshot_verifier.py

      - name: Run Step 38 regression tests
        run: |
          python -m pytest -q tests/test_ch25_step38_nse_field_reconciliation.py

      - name: Run Step 39 unit tests
        run: |
          python -m pytest -q tests/test_ch25_step39_nse_identity_continuity.py

      - name: Capture previous NSE snapshot
        run: |
          python scripts/run_nse_dated_snapshot_audit.py \
            --as-of-date "$PREVIOUS_DATE"

      - name: Verify previous snapshot
        run: |
          python scripts/verify_nse_dated_snapshot_audit.py \
            --as-of-date "$PREVIOUS_DATE"

      - name: Capture current NSE snapshot
        run: |
          python scripts/run_nse_dated_snapshot_audit.py \
            --as-of-date "$CURRENT_DATE"

      - name: Verify current snapshot
        run: |
          python scripts/verify_nse_dated_snapshot_audit.py \
            --as-of-date "$CURRENT_DATE"

      - name: Run Step 39 identity continuity
        run: |
          python scripts/run_ch25_step39_nse_identity_continuity.py \
            --previous-date "$PREVIOUS_DATE" \
            --current-date "$CURRENT_DATE"

      - name: Upload Step 39 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch25-step39-nse-identity-continuity
          path: |
            reports/nse_dated_snapshot_audit/
            reports/nse_identity_continuity/
          if-no-files-found: warn
          retention-days: 30
