name: TLP MIM CH02 Historical A-D Live Verification

on:
  workflow_dispatch:
  push:
    branches:
      - ch02-advance-decline-plan
    paths:
      - "core/market_intelligence/advance_decline.py"
      - "core/market_intelligence/ad_metrics.py"
      - "core/market_intelligence/cumulative_ad_line.py"
      - "core/market_intelligence/historical_ad_analysis.py"
      - "services/market_intelligence/historical_observation_service.py"
      - "services/market_intelligence/historical_ad_service.py"
      - "scripts/run_ch02_historical_ad_live_check.py"
      - ".github/workflows/ch02-historical-ad-live-check.yml"

permissions:
  contents: read

jobs:
  historical-ad-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bounded official NSE historical A-D verification
        run: |
          python scripts/run_ch02_historical_ad_live_check.py

      - name: Upload Chapter 02 live evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tlp-mim-ch02-historical-ad-live-evidence
          path: artifacts/ch02_historical_ad_live/
          if-no-files-found: warn
          retention-days: 14
