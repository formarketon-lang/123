
name: TradeLab Pro AMFI Live Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amfi-live-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run live AMFI and NSE verification
        run: |
          python scripts/run_amfi_live_check.py

      - name: Upload AMFI audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amfi-live-audit-report
          path: reports/market_cap/
          if-no-files-found: ignore
          
