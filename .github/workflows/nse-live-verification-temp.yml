name: TLP Temporary NSE Live Verification

on:
  push:
    branches:
      - audit/nse-live-verification-20261114

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NSE live data and provenance audit
        run: |
          python scripts/run_nse_live_check.py

      - name: Upload live audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlp-nse-live-verification
          path: |
            data/raw/nse/
            data/raw/yahoo/
          if-no-files-found: warn
          retention-days: 14
